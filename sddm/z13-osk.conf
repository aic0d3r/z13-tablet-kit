# z13-tablet-kit: on-screen keyboard at the SDDM Wayland login screen.
# The greeter's KWin needs --inputmethod to start plasma-keyboard, and
# InputMethod must be empty: CachyOS sets qtvirtualkeyboard, which hides the OSK
# under KWin. SDDM can't append flags, so this repeats the stock command.
[General]
InputMethod=

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1 --inputmethod plasma-keyboard
